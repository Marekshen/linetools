<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小工具庫</title>
<style>
  :root { --bg: #f4f6f9; --card: #fff; --ink: #2b1d0e; --muted: #6b5a48; --accent: #12355b; --line: #d6dde6; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #14171c; --card: #1e232b; --ink: #f2efe9; --muted: #aab2bd; --accent: #7fb2e5; --line: #2f3742; }
  }
  :root[data-theme="dark"] { --bg: #14171c; --card: #1e232b; --ink: #f2efe9; --muted: #aab2bd; --accent: #7fb2e5; --line: #2f3742; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Microsoft JhengHei', 'Noto Sans TC', sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; box-sizing: border-box; }
  h1 { font-size: 26px; margin: 12px 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  label { display: block; font-weight: 700; margin-bottom: 8px; }
  .inputrow { display: flex; gap: 10px; align-items: stretch; }
  textarea { flex: 1; min-width: 0; box-sizing: border-box; min-height: 88px; font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font-family: inherit; }
  .side { display: flex; flex-direction: column; gap: 10px; }
  .icon { width: 52px; min-width: 52px; flex: none; padding: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: 2px solid var(--accent); color: var(--accent); }
  .icon svg { width: 24px; height: 24px; }
  .btns { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  button { flex: 1; min-width: 140px; font-size: 17px; font-weight: 700; padding: 12px; border-radius: 12px; border: none; background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
  .result { word-break: break-all; font-size: 16px; margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--bg); border: 1px dashed var(--line); display: none; }
  .result.show { display: block; }
  .note { color: var(--muted); font-size: 14px; line-height: 1.6; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>小工具庫</h1>

  <div class="card">
    <label for="input">貼上網址</label>
    <div class="inputrow">
      <textarea id="input" placeholder="https://..." inputmode="url"></textarea>
      <div class="side">
        <button id="paste" type="button" class="icon" aria-label="貼上" title="貼上">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 12h6M9 16h4"/></svg>
        </button>
        <button id="copy" type="button" class="icon" aria-label="複製" title="複製">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        </button>
      </div>
    </div>
    <div class="btns">
      <button id="addParam" type="button">加外部參數</button>
      <button id="shorten" type="button" class="ghost">縮網址</button>
    </div>
    <div id="result" class="result" role="status"></div>
    <p id="fallback" class="note" style="display:none"></p>
  </div>

  <p class="note">加外部參數：在網址後面加上 openExternalBrowser=1，讓 LINE 用手機預設瀏覽器開啟。<br>縮網址：使用 TinyURL 服務，網址會送到 TinyURL。<br>複製：有結果就複製結果，沒有結果就複製輸入的內容。</p>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const input = $('input');
  const resultBox = $('result');
  const fallback = $('fallback');
  const copyBtn = $('copy');
  let lastResult = '';

  function toUrl(raw) {
    const s = raw.trim().match(/https?:\/\/\S+/)?.[0];
    if (!s) return null;
    try { return new URL(s); } catch { return null; }
  }

  function clearFallback() {
    fallback.style.display = 'none';
    fallback.textContent = '';
  }

  function showFallback(html) {
    fallback.style.display = '';
    fallback.innerHTML = html;
  }

  function show(text) {
    lastResult = text;
    resultBox.textContent = text;
    resultBox.classList.add('show');
  }

  function clearResult() {
    lastResult = '';
    resultBox.textContent = '';
    resultBox.classList.remove('show');
  }

  function notValid() {
    clearFallback();
    clearResult();
    showFallback('請貼上以 http:// 或 https:// 開頭的完整網址。');
  }

  $('paste').addEventListener('click', async () => {
    try {
      input.value = await navigator.clipboard.readText();
      input.focus();
    } catch {
      showFallback('無法讀取剪貼簿，請長按輸入框手動貼上。');
    }
  });

  copyBtn.addEventListener('click', async () => {
    const text = lastResult || input.value;
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      copyBtn.style.borderColor = 'var(--ink)';
      setTimeout(() => { copyBtn.style.borderColor = ''; }, 800);
    } catch {
      showFallback('無法寫入剪貼簿，請長按結果手動複製。');
    }
  });

  $('addParam').addEventListener('click', () => {
    const url = toUrl(input.value);
    if (!url) return notValid();
    url.searchParams.set('openExternalBrowser', '1');
    clearFallback();
    show(url.toString());
  });

  $('shorten').addEventListener('click', async () => {
    const url = toUrl(input.value);
    if (!url) return notValid();
    clearFallback();
    show('縮網址中…');
    try {
      const res = await fetch('https://tinyurl.com/api-create.php?url=' + encodeURIComponent(url.toString()));
      const text = (await res.text()).trim();
      if (!res.ok || !text.startsWith('https://tinyurl.com/')) throw new Error('bad response');
      show(text);
    } catch {
      clearResult();
      showFallback('縮網址失敗（瀏覽器可能擋下跨網站請求）。可以到 <a href="https://tinyurl.com/app" target="_blank" rel="noopener">TinyURL 官網</a> 自己縮。');
    }
  });
</script>
</body>
</html>
